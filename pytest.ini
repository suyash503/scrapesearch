[pytest]
# One test run for both halves of the repo. `pythonpath` puts both project roots on sys.path,
# so tests can `import scrapesearch...` (scraper) and `import search...` (Django) directly.
pythonpath = scraper backend
testpaths = scraper/tests backend/tests
DJANGO_SETTINGS_MODULE = config.settings
addopts = -ra --strict-markers
markers =
    es: needs a running Elasticsearch (skipped automatically if it's not reachable)
filterwarnings =
    ignore::DeprecationWarning:twisted.*
