# nginx site for ScrapeSearch.
# Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/scrapesearch
#           sudo ln -s /etc/nginx/sites-available/scrapesearch /etc/nginx/sites-enabled/
#           sudo rm -f /etc/nginx/sites-enabled/default
#           sudo nginx -t && sudo systemctl reload nginx
# Replace example.com with your domain (or the server's IP while you don't have one).
#
# One origin for everything: the browser loads the React app and calls /api on the same host,
# so there's no CORS, just like the Vite dev proxy locally.

# Rate limit the API per client IP: 10 requests/second, stored in a 10 MB shared zone.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

upstream django {
    server 127.0.0.1:8000;  # gunicorn, bound to localhost only
    keepalive 16;           # reuse connections to gunicorn instead of opening one per request
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # certbot --nginx will add the `listen 443 ssl` lines and certificate paths here,
    # plus a redirect from http to https.

    # Hide the nginx version in error pages and headers (less info for attackers).
    server_tokens off;
    client_max_body_size 1m;  # the API only takes GETs, so reject big uploads early

    # ---- gzip: compress text responses (JSON, JS, CSS). The 230 KB JS bundle ships as ~72 KB. ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;  # tiny responses aren't worth the CPU
    gzip_vary on;          # tell caches the response depends on Accept-Encoding
    gzip_proxied any;      # also compress responses coming back from gunicorn
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # ---- Security headers ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- React build (npm run build -> frontend/dist) ----
    root /home/deploy/scrapesearch/frontend/dist;
    index index.html;

    # Caching is set with `expires`, NOT `add_header Cache-Control ...`: nginx gotcha, any add_header
    # inside a location throws away ALL add_header lines inherited from the server block, which would
    # silently drop the security headers above on exactly these pages.

    # Vite puts a content hash in asset filenames (index-B1c0w2B0.js), so they can be cached for a year:
    # a new build means a new filename.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Everything else: serve the file if it exists, otherwise index.html (a single-page app handles its
    # own URLs). `expires -1` = "Cache-Control: no-cache", so browsers always get the newest index.html,
    # which points at the newest asset filenames.
    location / {
        expires -1;
        try_files $uri /index.html;
    }

    # ---- Django API ----
    location /api/ {
        limit_req zone=api burst=20 nodelay;  # allow short bursts (autocomplete), then 503 on abuse

        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";  # needed for upstream keepalive
        # Tell Django who the real client is and what host/scheme they used.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;  # matches gunicorn --timeout
    }

    # ---- Django admin + its static files (collectstatic -> backend/staticfiles) ----
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        alias /home/deploy/scrapesearch/backend/staticfiles/;
        expires 30d;
    }
}
